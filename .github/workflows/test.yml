name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Check JavaScript
        working-directory: plugins/claude-code-interactive
        run: |
          node --check server/session-controller.mjs
          node --check scripts/claude-session.mjs
          node --check scripts/cli-smoke-test.mjs
          node --check scripts/smoke-test.mjs
      - name: Run smoke tests
        working-directory: plugins/claude-code-interactive
        run: |
          node scripts/cli-smoke-test.mjs
          node scripts/smoke-test.mjs
